on:
  push:
    branches:
      - main
      - module9/software-evolution
  pull_request:
    branches:
      - main
      - module9/software-evolution

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build Vue application
        run: npm run build